<head>
    <style>
        /* bg colors lifted from default.color-theme.json / dark.color-theme.json so the
           splash doesn't flash a different shade before Theia's real CSS lands */
        @media (prefers-color-scheme: light) {
            html {
                background: #ffffff;
            }
        }

        @media (prefers-color-scheme: dark) {
            html {
                background: #1f272a;
            }
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            /* copied from upstream Theia so there's no flicker when its CSS loads */
            background-image: none;
        }

        .theia-preload::after {
            /* kill the default Theia loading animation; we bring our own octopus */
            content: none;
        }

        .spinner-container {
            display: flex;
            flex-direction: center;
            align-self: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .custom-spinner {
            align-self: center;
        }

        .custom-spinner img {
            width: 18vh;
            height: 18vh;
            object-fit: contain;
            animation-delay: 0;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-name: preload-spinner;
            animation-timing-function: ease;
        }

        @keyframes preload-spinner {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.85);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
